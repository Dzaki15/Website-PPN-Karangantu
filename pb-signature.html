<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tanda Tangan - ARSIP PINTAR</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Righteous&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="page skkp-page">
  <header class="form-header stblkk-header">
    <button class="back-btn" type="button" aria-label="Kembali" onclick="goBack()">←</button>
    <div class="header-text">
      <p class="eyebrow">Tanda Tangan Persetujuan</p>
      <h1>Persetujuan Berlayar</h1>
      <p class="subtitle">Silakan tanda tangan Pemberi Layanan.</p>
    </div>
    <img src="assets/Kementerian Kelautan dan Perikanan (KKP) Republik Indonesia.png" alt="Logo KKP" class="form-logo" />
  </header>

  <main class="container stblkk-container">
    <section class="form-section stblkk-step active">
      <div class="section-header-row">
        <div>
          <p class="section-eyebrow">Langkah Final</p>
          <h3>Tanda Tangan</h3>
          <p class="section-subtitle">Silakan tanda tangan Pemberi Layanan di area canvas atau upload file tanda tangan.</p>
        </div>
        <span class="badge badge-success">Final</span>
      </div>

      <div class="signature-box">
        <canvas id="signatureCanvas" width="400" height="120" style="border: 2px solid #06b0b8; border-radius: 8px; background: white; display: block; margin: 0 auto; max-width: 100%; cursor: crosshair;"></canvas>
        <p class="signature-instruction" style="margin-top: 15px;">Atau upload file tanda tangan</p>
        <label class="upload-btn">
          <input type="file" id="uploadInput" accept="image/*" style="display:none;">
          <span>📁 Pilih File</span>
        </label>
      </div>

      <div class="nav-buttons">
        <button type="button" class="btn secondary" onclick="resetSignature()">Reset</button>
        <button type="button" class="btn primary" onclick="saveSignature()">Selanjutnya</button>
      </div>
    </section>
  </main>

  <script src="js/script.js"></script>
  <script>
    const canvas = document.getElementById('signatureCanvas');
    const uploadInput = document.getElementById('uploadInput');
    const sig = (typeof window.setupSignatureCanvas === 'function')
      ? window.setupSignatureCanvas(canvas, { strokeStyle: '#000', lineWidth: 2 })
      : null;

    // File upload
    uploadInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        if (sig) {
          sig.loadDataUrl(event.target.result);
          return;
        }
        const ctx = canvas.getContext('2d');
        const img = new Image();
        img.onload = function() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          const scale = Math.min(canvas.width / img.width, canvas.height / img.height);
          const x = (canvas.width - img.width * scale) / 2;
          const y = (canvas.height - img.height * scale) / 2;
          ctx.drawImage(img, x, y, img.width * scale, img.height * scale);
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function resetSignature() {
      if (sig) {
        sig.clear();
      } else {
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      uploadInput.value = '';
    }

    function goBack() {
      navigateWithFade('pb-form.html');
    }

    async function saveSignature() {
      const hasInk = sig ? sig.hasInk() : true;
      if (!hasInk) {
        alert('Mohon buat tanda tangan terlebih dahulu!');
        return;
      }

      // Convert canvas to base64
      const signatureData = sig ? sig.toDataUrl() : canvas.toDataURL('image/png');
      localStorage.setItem('pbSignature', signatureData);

      // Update PB draft in backend with signature image embedded in data
      const id = Number(localStorage.getItem('pbFormId'));
      const data = JSON.parse(localStorage.getItem('pbFormData') || '{}');
      data.signature = signatureData;
      
      try {
        const res = await apiPut(`/api/pb/${id}`, { data, status: 'signed' });
        localStorage.setItem('pbFormData', JSON.stringify(res.data));
      } catch(err){
        console.warn('Server offline. Proceeding with localStorage signature.', err);
        // Fallback: keep signature locally
        localStorage.setItem('pbFormData', JSON.stringify(data));
      }
      
      // Navigate to preview regardless of server status
      navigateWithFade('pb-preview.html');
    }
  </script>
</body>
</html>
