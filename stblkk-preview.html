<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Preview STBLKK - ARSIP PINTAR</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Righteous&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .preview-container { background:white; border:3px solid var(--primary); border-radius:14px; padding:24px; margin:20px 0; min-height:240px; display:flex; flex-direction:column; gap:12px; }
    .pdf-viewer { width:100%; min-height:380px; max-height:760px; overflow:auto; border-radius:10px; background:#f6f6f6; padding:16px; box-sizing:border-box; }
    #pdfPages { width:100%; display:flex; flex-direction:column; gap:18px; align-items:center; }
    .pdf-page-placeholder { width:800px; max-width:100%; min-height:420px; background:#f3f3f3; border-radius:8px; display:flex; align-items:center; justify-content:center; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.03); }
    .pdf-page-placeholder canvas { display:block; width:100%; height:auto; border-radius:6px; background:white; }
    .btn-action { width:100%; margin-top:12px; display:flex; align-items:center; justify-content:center; gap:10px; font-size:18px; }
    .btn.download { background: var(--primary); color:white; }
    .btn.save { background: #e0e0e0; color:#333; }
    .btn.home { background: var(--primary); color:white; }
  </style>
</head>
<body class="page preview-page">
  <header class="topbar">
    <button class="back-btn" onclick="navigateWithFade('stblkk-signature.html')">←</button>
    <h2 style="margin:0; font-size:18px;">Preview STBLKK</h2>
  </header>

  <main class="container">
    <div class="preview-container">
      <h3 class="doc-title" style="text-align:center;">Pratinjau Dokumen STBLKK</h3>
      <div style="width:100%;display:flex;align-items:center;justify-content:center;margin-bottom:12px;gap:12px;flex-wrap:wrap;">
        <div style="margin-left:auto;display:flex;align-items:center;gap:8px;">
          <button id="prevPageBtn" class="btn" style="padding:6px 10px;border-radius:6px;">⟨ Prev</button>
          <div id="pageIndicator" style="font-size:13px;color:#333;min-width:120px;text-align:center;">Halaman 1 / 1</div>
          <button id="nextPageBtn" class="btn" style="padding:6px 10px;border-radius:6px;">Next ⟩</button>
        </div>
      </div>
      <div id="pdfContainer" class="pdf-viewer">
        <div id="pdfPages"></div>
      </div>
    </div>

    <button type="button" class="btn download btn-action" onclick="handleDownloadPDF()">
      Download PDF
    </button>

    <button type="button" class="btn save btn-action" onclick="handleSaveArchive()">
      <span style="font-size:24px">🔖</span>
      Simpan & Ajukan
    </button>

    <button type="button" class="btn home btn-action" onclick="navigateWithFade('home.html')">
      Home
    </button>
  </main>

  <script src="js/script.js"></script>
  <script src="assets/pdf-lib.min.js"></script>
  <script src="js/stblkk-pdf-builder.js"></script>
  <script src="assets/pdfjs/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = '../assets/pdfjs/pdf.worker.min.js';
    let pdfDoc = null;
    let currentPage = 1;
    let totalPages = 0;

    async function buildPDFBlob(){
      const data = JSON.parse(localStorage.getItem('stblkkData') || '{}');
      const signature = localStorage.getItem('stblkkSignature');
      return await generateSTBLKKPDF({
        namaPengguna: data.namaPengguna,
        alamatPengguna: data.alamatPengguna,
        tanggalPengajuan: data.tanggalPengajuan,
        namaPemberiLayanan: data.namaPemberiLayanan,
        persyaratan: data.persyaratan,
        flowSteps: data.flowSteps,
        signature
      });
    }

    async function renderPDF(){
      try {
        const blob = await buildPDFBlob();
        const arrayBuffer = await blob.arrayBuffer();
        pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        totalPages = pdfDoc.numPages;
        document.getElementById('pageIndicator').textContent = `Halaman ${currentPage} / ${totalPages}`;
        renderPage(currentPage);
      } catch (err) {
        console.error('Render PDF gagal', err);
        alert('Gagal menampilkan preview PDF');
      }
    }

    async function renderPage(pageNum){
      if(!pdfDoc) return;
      try {
        const page = await pdfDoc.getPage(pageNum);
        const viewport = page.getViewport({ scale: 1.5 });
        let container = document.getElementById(`page-${pageNum}`);
        if(!container){
          container = document.createElement('div');
          container.id = `page-${pageNum}`;
          container.className = 'pdf-page-placeholder';
          document.getElementById('pdfPages').appendChild(container);
        }
        container.innerHTML = '';
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        await page.render({ canvasContext: ctx, viewport }).promise;
        container.appendChild(canvas);
      } catch (err) {
        console.error('Render page error', err);
      }
    }

    function goToPage(num){
      if(num < 1 || num > totalPages) return;
      currentPage = num;
      document.getElementById('pageIndicator').textContent = `Halaman ${currentPage} / ${totalPages}`;
      renderPage(currentPage);
    }

    document.getElementById('prevPageBtn').onclick = ()=> goToPage(currentPage-1);
    document.getElementById('nextPageBtn').onclick = ()=> goToPage(currentPage+1);
    renderPDF();

    async function handleDownloadPDF(){
      const btn = event.target.closest('button');
      btn.disabled = true;
      btn.innerHTML = '<span style="font-size:24px">⏳</span> Memproses...';
      try {
        const blob = await buildPDFBlob();
        const data = JSON.parse(localStorage.getItem('stblkkData') || '{}');
        const safeName = data.namaPengguna || 'dokumen';
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `STBLKK-${safeName}.pdf`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch(err){
        alert('Gagal mengunduh PDF');
        console.error(err);
      }
      btn.disabled = false;
      btn.innerHTML = 'Download PDF';
    }

    function handleSaveArchive(){
      const btn = event.target.closest('button');
      btn.disabled = true;
      btn.innerHTML = '<span style="font-size:24px">⏳</span> Menyimpan...';
      try {
        const data = JSON.parse(localStorage.getItem('stblkkData') || '{}');
        if(typeof window.archiveDocument === 'function'){
          // Store the exact same PDF bytes so Arsip Dokumen preview matches 1:1
          (async () => {
            let pdfBlob;
            try {
              pdfBlob = await buildPDFBlob();
            } catch (e) {
              console.warn('Gagal membuat PDF untuk arsip:', e);
            }
          window.archiveDocument({
            serviceSlug: 'stblkk',
            serviceName: 'Form STBLKK',
            userName: data.namaPengguna || 'Tanpa Nama',
            data,
            fileName: `STBLKK-${data.namaPengguna || 'dokumen'}.pdf`,
            pdfBlob
          });
          alert('Data berhasil disimpan');
          navigateWithFade('home.html');
          })();
        } else {
          alert('Fungsi archive tidak tersedia');
        }
      } catch(err){
        alert('Gagal menyimpan');
        console.error(err);
      }
      btn.disabled = false;
      btn.innerHTML = '<span style="font-size:24px">🔖</span> Simpan';
    }
  </script>
</body>
</html>
